<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Importar relatorios financeiros</title>
    <link rel="stylesheet" href="styles.css?v=20260616-1">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Importacao mensal</p>
        <h1>Relatorios financeiros</h1>
      </div>
      <div class="toolbar">
        <a class="unit-button" href="index.html">Dashboard</a>
      </div>
    </header>

    <main class="upload-main">
      <section class="panel upload-panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">Novo mes</p>
            <h2>Selecionar PDFs de competencia, caixa e extratos</h2>
          </div>
        </div>

        <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
          <label>
            Mes
            <input name="month" type="month" value="2026-03" required>
          </label>

          <div class="upload-group">
            <div>
              <p class="eyebrow">Competencia</p>
              <h3>Relatorios para a analise gerencial</h3>
            </div>

            <label>
              Competencia Barra
              <input name="competence_report_barra" type="file" accept="application/pdf" required>
            </label>

            <label>
              Competencia Leblon
              <input name="competence_report_leblon" type="file" accept="application/pdf" required>
            </label>

            <label>
              Competencia JB Loja
              <input name="competence_report_jb_loja" type="file" accept="application/pdf" required>
            </label>

            <label>
              Competencia JB Delivery Filial
              <input name="competence_report_jb_delivery" type="file" accept="application/pdf" required>
            </label>
          </div>

          <div class="upload-group">
            <div>
              <p class="eyebrow">Caixa</p>
              <h3>Relatorios para conferencia bancaria</h3>
            </div>

            <label>
              Caixa Barra
              <input name="cash_report_barra" type="file" accept="application/pdf" required>
            </label>

            <label>
              Caixa Leblon
              <input name="cash_report_leblon" type="file" accept="application/pdf" required>
            </label>

            <label>
              Caixa JB Loja
              <input name="cash_report_jb_loja" type="file" accept="application/pdf" required>
            </label>

            <label>
              Caixa JB Delivery Filial
              <input name="cash_report_jb_delivery" type="file" accept="application/pdf" required>
            </label>
          </div>

          <label>
            Extratos bancarios
            <input name="bank_files" type="file" accept="application/pdf" multiple>
          </label>

          <button class="unit-button active upload-submit" type="submit">Importar mes</button>
        </form>

        <pre id="uploadResult" class="upload-result">Aguardando envio.</pre>
      </section>
    </main>

    <script type="module">
      import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";
      import { buildFinancePackage } from "./browser-importer.js?v=20260618-2";

      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

      const form = document.querySelector("#uploadForm");
      const result = document.querySelector("#uploadResult");

      function packageKey(month) {
        return `financePackage:${month}`;
      }

      function uploadPackageKey(month, runId) {
        return `financeUpload:${month}:${runId}`;
      }

      function clearMonthPackages(month) {
        localStorage.removeItem(packageKey(month));
        Object.keys(localStorage)
          .filter((key) => key.startsWith(`financeUpload:${month}:`))
          .forEach((key) => localStorage.removeItem(key));
      }

      function savePackage(month, runId, pack) {
        localStorage.setItem(uploadPackageKey(month, runId), JSON.stringify(pack));
      }

      function downloadJson(filename, payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Lendo PDFs no navegador...";

        const formData = new FormData(form);
        const month = formData.get("month");
        const runId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
        clearMonthPackages(month);
        const competenceReportFiles = {
          competence_report_barra: formData.get("competence_report_barra"),
          competence_report_leblon: formData.get("competence_report_leblon"),
          competence_report_jb_loja: formData.get("competence_report_jb_loja"),
          competence_report_jb_delivery: formData.get("competence_report_jb_delivery")
        };
        const cashReportFiles = {
          cash_report_barra: formData.get("cash_report_barra"),
          cash_report_leblon: formData.get("cash_report_leblon"),
          cash_report_jb_loja: formData.get("cash_report_jb_loja"),
          cash_report_jb_delivery: formData.get("cash_report_jb_delivery")
        };
        const bankFiles = formData.getAll("bank_files").filter((file) => file.size > 0);

        try {
          const pack = await buildFinancePackage({
            month,
            competenceReportFiles,
            cashReportFiles,
            bankFiles,
            pdfjsLib,
            onProgress: (message) => {
              result.textContent = message;
            }
          });
          savePackage(month, runId, pack);
          const summaryRows = pack.dataset.units.map((unit) => (
            `${unit.name}: faturamento ${formatCurrency(unit.revenue)} | despesas ${formatCurrency(unit.expenses)} | lucro ${formatCurrency(unit.realProfit)}`
          )).join("\n");

          result.innerHTML = `
Importacao concluida.

Mes: ${month}
Analise salva neste navegador.
PDFs processados localmente; nenhum arquivo foi enviado para servidor.

Resumo lido dos relatorios:
${summaryRows}

<a class="unit-button active upload-link" href="index.html?month=${month}&source=upload&run=${runId}">Abrir dashboard do mes</a>
<button class="unit-button upload-link" id="downloadPackage" type="button">Baixar pacote do mes</button>
          `.trim();

          document.querySelector("#downloadPackage").addEventListener("click", () => {
            downloadJson(`${month}.financeiro.json`, pack);
          });
        } catch (error) {
          clearMonthPackages(month);
          result.textContent = `Erro ao processar PDFs no navegador:\n${error.message}`;
          console.error(error);
        }
      });

      function formatCurrency(value) {
        return Number(value || 0).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
          maximumFractionDigits: 0
        });
      }
    </script>
  </body>
</html>
