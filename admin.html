<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Importar relatorios financeiros</title>
    <link rel="stylesheet" href="styles.css?v=20260530-1">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Importacao mensal</p>
        <h1>Relatorios financeiros</h1>
      </div>
      <div class="toolbar">
        <a class="unit-button" href="index.html">Dashboard</a>
      </div>
    </header>

    <main class="upload-main">
      <section class="panel upload-panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">Novo mes</p>
            <h2>Selecionar PDFs do Linx e extratos</h2>
          </div>
        </div>

        <form id="uploadForm" class="upload-form" enctype="multipart/form-data">
          <label>
            Mes
            <input name="month" type="month" value="2026-03" required>
          </label>

          <label>
            Relatorio Barra
            <input name="report_barra" type="file" accept="application/pdf" required>
          </label>

          <label>
            Relatorio Leblon
            <input name="report_leblon" type="file" accept="application/pdf" required>
          </label>

          <label>
            Relatorio JB Loja
            <input name="report_jb_loja" type="file" accept="application/pdf" required>
          </label>

          <label>
            Relatorio JB Delivery Filial
            <input name="report_jb_delivery" type="file" accept="application/pdf" required>
          </label>

          <label>
            Extratos bancarios
            <input name="bank_files" type="file" accept="application/pdf" multiple>
          </label>

          <button class="unit-button active upload-submit" type="submit">Importar mes</button>
        </form>

        <pre id="uploadResult" class="upload-result">Aguardando envio.</pre>
      </section>
    </main>

    <script type="module">
      import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";
      import { buildFinancePackage } from "./browser-importer.js?v=20260530-2";

      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

      const form = document.querySelector("#uploadForm");
      const result = document.querySelector("#uploadResult");

      function packageKey(month) {
        return `financePackage:${month}`;
      }

      function savePackage(month, pack) {
        localStorage.setItem(packageKey(month), JSON.stringify(pack));
      }

      function downloadJson(filename, payload) {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        URL.revokeObjectURL(url);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Lendo PDFs no navegador...";

        const formData = new FormData(form);
        const month = formData.get("month");
        const reportFiles = {
          report_barra: formData.get("report_barra"),
          report_leblon: formData.get("report_leblon"),
          report_jb_loja: formData.get("report_jb_loja"),
          report_jb_delivery: formData.get("report_jb_delivery")
        };
        const bankFiles = formData.getAll("bank_files").filter((file) => file.size > 0);

        try {
          const pack = await buildFinancePackage({
            month,
            reportFiles,
            bankFiles,
            pdfjsLib,
            onProgress: (message) => {
              result.textContent = message;
            }
          });
          savePackage(month, pack);

          result.innerHTML = `
Importacao concluida.

Mes: ${month}
Analise salva neste navegador.
PDFs processados localmente; nenhum arquivo foi enviado para servidor.

<a class="unit-button active upload-link" href="index.html?month=${month}&source=local">Abrir dashboard do mes</a>
<button class="unit-button upload-link" id="downloadPackage" type="button">Baixar pacote do mes</button>
          `.trim();

          document.querySelector("#downloadPackage").addEventListener("click", () => {
            downloadJson(`${month}.financeiro.json`, pack);
          });
        } catch (error) {
          result.textContent = `Erro ao processar PDFs no navegador:\n${error.message}`;
          console.error(error);
        }
      });
    </script>
  </body>
</html>
